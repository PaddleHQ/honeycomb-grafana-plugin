name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend for all platforms
        run: mage build:all

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(jq -r .id plugin.json)
          PLUGIN_VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"

          # Create dist directory if needed.
          mkdir -p dist

          # Copy required plugin files into dist.
          cp -r img dist/ 2>/dev/null || true

          # Zip everything up.
          zip -r "${ARCHIVE}" dist/ plugin.json LICENSE README.md provisioning/

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
          body: |
            ## Honeycomb Grafana Data Source Plugin ${{ steps.package.outputs.plugin_version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Installation
            ```bash
            grafana-cli plugins install honeycombio-honeycomb-datasource ${{ steps.package.outputs.plugin_version }}
            ```
            Or copy the zip to your Grafana plugins directory.
